name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile build_scores.py build_html.py scripts/*.py

      - name: Rebuild evidence ledger
        run: python build_scores.py

      - name: Check ledger is committed
        run: git diff --exit-code --ignore-cr-at-eol -- data/scores.csv

      - name: Validate data and HTML
        run: python scripts/validate.py
