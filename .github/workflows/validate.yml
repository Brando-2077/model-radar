name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile build.py radar/*.py scripts/*.py

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Rebuild (pipeline + HTML)
        run: python build.py

      - name: Check ledger is committed
        run: git diff --exit-code --ignore-cr-at-eol -- data/scores.csv

      - name: Validate data and HTML
        run: python scripts/validate.py
