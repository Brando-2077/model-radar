name: Feature request
description: 页面、图表、文档或工作流建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明“要解决什么问题”，再说明“建议怎么做”。
        涉及计分口径、维度定义、场景权重的大改，请先开 Issue 讨论，不要直接提大 PR。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述交互、图表、数据结构或文档改法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议不把价格 / 套餐等非能力信息塞进雷达轴
          required: true
        - label: 这个建议不把缺失数据当 0 分处理
          required: true
        - label: 这个建议保持单文件 HTML 交付（不引入后端/CDN 运行时依赖）
          required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充材料
      description: 截图、参考链接、草图等
    validations:
      required: false
